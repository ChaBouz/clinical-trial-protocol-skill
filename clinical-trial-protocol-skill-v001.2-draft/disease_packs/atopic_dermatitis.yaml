# disease_packs/atopic_dermatitis.yaml  (DRAFT 2026-10-03)
# 中等症〜重症アトピー性皮膚炎（AD）・成人（±青年）・全身療法（生物学的製剤／経口）の
# 第 3 相・プラセボ対照・単剤（monotherapy）試験の既定値。
#
# 出典の書き方:
#   REF  = 参照プロトコル NCT05398445（Amgen 20210142, Amendment 6）の節
#   CTG  = 同試験の ClinicalTrials.gov 登録（MCP で 2026-10-03 取得）
#   PREC = FDA が公開した審査パッケージの「Administrative and Correspondence Documents」（Drugs@FDA）。
#          書式 <略号>:s<N>/<論点> ＝ 原本 PDF の p<N> から始まる会議録・書簡の、<論点>（Question 番号。
#          番号の無い節は節の開始頁 p<M>）に対する FDA の回答・議事。
#          例 Dupi:s117/Q4a = BLA 761055（dupilumab）の PDF p117 から始まる会議録の Question 4a。
#          略号: Dupi = BLA 761055 dupilumab ／ Abro = NDA 213871 abrocitinib ／ Lebri = BLA 761306 lebrikizumab ／
#                Nemo = BLA 761391 nemolizumab ／ Tralo = BLA 761180 tralokinumab（いずれも Orig1s000）
#   PI   = 米国添付文書（USPI）
# 既定値は「書き始めの値」。USER が変えたら USER が優先。変えた行は 4.2 節に理由を書く。

meta:
  disease: atopic_dermatitis
  aliases: ["atopic dermatitis", "AD", "atopic eczema", "アトピー性皮膚炎"]   # Step 0 の名前の照合に使う別名（完全一致）
  therapeutic_area_family: immunology_inflammation
  endpoint_archetype: binary_responder
  status: draft   # 人の確認前（2026-10-03 保留）
  primary_timepoint_default: "Week 16"
  population_default: "adults ≥18 y with moderate-to-severe AD inadequately controlled by topical therapy"
  design_default: "randomized, double-blind, placebo-controlled, parallel-group, monotherapy"
  induction_week_default: 16      # PREC: Dupi/Lebri/Abro は Week 16（Tralo は当初 Week 12 を提案）
  note_week24: "REF は Week 24 を主要時点にした例。16 か 24 かは USER が選ぶ"

terminology:
  vIGA-AD: "validated Investigator's Global Assessment for AD（0–4 の 5 段階、形態の記述つき）"
  EASI: "Eczema Area and Severity Index（0–72）"
  PP-NRS: "Peak/Worst Pruritus NRS（0–10、24 時間想起、日誌で毎日、週平均で評価）"
  rIGA: "vIGA-AD 0、または 1 かつ紅斑がかろうじて認められる程度（REF の US 用 co-primary）"

inclusion:          # 5.2 節。各行を完全な文にする。測定時点は screening と Day 1（randomization 前）の両方
  - {key: age, text: "Age ≥18 years (or legal adult age in country, whichever is older) at consent", src: [CTG, REF:5.1-102]}
  - {key: diagnosis, text: "AD per AAD Consensus Criteria (Eichenfield 2014) present ≥12 months before consent", src: [CTG, REF:5.1-113]}
  - {key: topical_failure, text: "Documented inadequate response to medium-to-higher potency TCS (±TCI) or topical therapy medically inadvisable", define: "IGA 0–2 を達成・維持できない（中〜強力 TCS を 28 日以上 or 添付文書の最長期間）; 記録＝診療録", src: [CTG, REF:5.1-114, PREC:Dupi:s117/Q2]}
  - {key: easi, text: "EASI ≥16 at screening and Day 1", src: [CTG, REF:5.1-105/106, PREC:Abro:s26/Q3]}
  - {key: viga, text: "vIGA-AD ≥3 at screening and Day 1", src: [CTG, REF:5.1-107/108]}
  - {key: bsa, text: "≥10% BSA involvement at screening and Day 1", src: [CTG, PREC:Abro:s26/Q3]}
  - {key: pruritus, text: "Weekly average PP-NRS ≥4 at baseline", src: [CTG, REF:5.1-111, PREC:Tralo:s42/Q2]}
  - {key: diary, text: "≥4 daily diary entries in the 14 days up to and including Day 1", src: [REF:5.1-112]}
  - {key: emollient, text: "Willing to apply a stable bland emollient twice daily for ≥7 days before Day 1 and throughout", src: [PREC:Tralo:s42/Q4], status: DERIVED}
  - {key: consent, text: "Signed informed consent before any study-specific procedure", src: [STD]}

exclusion:          # 5.3 節。区分の順に並べ、洗い出し期間は表にする
  medical:
    - {text: "Active malignancy or history within 5 years (except treated in situ cervical, cutaneous BCC/SCC)", src: [REF:201]}
    - {text: "Serious hypersensitivity to biologics or excipients", src: [REF:202,203]}
    - {text: "Helminth infection within 6 months not adequately treated", src: [REF:204]}
    - {text: "HIV, active HBV (detectable DNA), HCV RNA positive", src: [REF:205-207]}
    - {text: "Positive/indeterminate IGRA unless documented adequate prophylaxis and negative chest X-ray", src: [REF:237, REF:8.10.1]}
    - {text: "Active infection requiring systemic anti-infectives within 4 weeks; superficial skin infection within 2 weeks", src: [REF:230,211]}
    - {text: "QTc ≥450 ms (male) / ≥470 ms (female); NYHA III/IV; uncontrolled hypertension; recent MI/stroke within 6 months", src: [REF:209,231,232], note: "心血管の基準は機序依存。JAK 阻害薬なら MACE/VTE リスクで強める"}
    - {text: "eGFR <30; AST/ALT >2.5×ULN; neutrophils <1.5×10^9/L", src: [REF:213]}
    - {text: "Severe depression, poorly controlled psychiatric disease, psychiatric admission within 1 year", src: [REF:228]}
    - {text: "Other skin disease interfering with AD assessment (e.g., psoriasis)", src: [REF:227]}
  prior_therapy_washout:   # 表にする（薬剤群 | 期間）
    - {class: "Biologics for AD/immune disease (dupilumab, tralokinumab, lebrikizumab, anti-IgE, TNF 等)", washout: "12 weeks or 5 half-lives, whichever longer", src: [CTG, REF:214]}
    - {class: "Cell-depleting therapy", washout: "12 months or until counts normal", src: [REF:215]}
    - {class: "Systemic corticosteroids, systemic immunosuppressants, phototherapy, oral/topical JAK inhibitors", washout: "4 weeks or 5 half-lives", src: [CTG, REF:233]}
    - {class: "TCS, TCI, topical PDE4, other topical immunosuppressants", washout: "1 week", src: [CTG, REF:238]}
    - {class: "Live/attenuated vaccines", washout: "12 weeks; prohibited during study", src: [REF:219]}
    - {class: "Other investigational product", washout: "30 days or 5 half-lives (Japan: 16 weeks)", src: [REF:239]}
  other:
    - {text: "Pregnant, breastfeeding, or planning pregnancy through end of contraception period; WOCBP unwilling to use contraception", src: [REF:222-225], note: "期間は半減期から [TBD]（REF は最終投与後 16 週）"}
    - {text: "Prior exposure to the investigational product / same target", src: [REF:220]}
    - {text: "Unable to comply with visits or COAs", src: [REF:226]}

endpoints:
  primary:
    default: "Proportion achieving vIGA-AD 0/1 with ≥2-point reduction from baseline at Week 16"
    coprimary_option: "AND proportion achieving EASI-75 at Week 16（両方で有意＝成功）"
    rules:
      - "co-primary にする EASI は EASI-75 以上（EASI-50 は臨床的に不十分）— PREC:Dupi:s117/Q4a, Q4e"
      - "EASI の変化量・変化率を主要にしない（表示に訳せない）— PREC:Dupi:s138/Q2, Lebri:s21/p28"
      - "US と ex-US で co-primary が違う例: REF は US=rIGA 0/1+EASI-75、ex-US=vIGA-AD 0/1+EASI-75（SAP 4.2）"
  key_secondary:   # 多重性管理下（10.10）。数を絞る — PREC:Lebri:s21/p28
    - "EASI-75 at Week 16 (if not co-primary)"
    - "EASI-90 at Week 16"
    - "≥4-point improvement in weekly average PP-NRS at Week 16 among subjects with baseline ≥4 — PREC:Abro:s26/Q3, Lebri:s2/Q4"
    - "≥4-point improvement in AD skin pain NRS (baseline ≥4)"
    - "≥4-point improvement in DLQI (baseline ≥4)"
  other_secondary:
    - "Change from baseline in PP-NRS, DLQI, POEM, SCORAD, sleep disturbance NRS（連続量は 1 時点で解析）— PREC:Nemo:s19/Q14"
    - "HADS anxiety/depression <8 among baseline ≥8"
  exploratory: ["PK (trough)", "ADA/NAb", "biomarkers (TARC/CCL17, IgE)", "facial/hand AD severity"]
  safety: ["TEAEs, SAEs, AESIs, labs, vitals, ECG"]

instruments:        # 8.3 節。尺度ごとに 評価者・訓練・想起・得点・responder・時点
  vIGA-AD: {rater: "訓練を受けた治験責任医師/分担医師（可能なら同一評価者）", note: "形態記述つきの検証版を使い付録に全文 — PREC:Tralo:s42/Q5"}
  EASI: {rater: same, regions: 4, range: "0–72"}
  PP-NRS: {mode: "eDiary 毎日", recall: "24h", score: "週平均（7 日中 4 日以上で計算）", responder: "≥4 点改善（基準値 ≥4）", notes: "通知機能と故障時の代替手段 — PREC:Abro:s26/Q14"}
  skin_pain_NRS: {mode: eDiary, responder: "≥4 点"}
  sleep_NRS: {mode: eDiary}
  DLQI: {recall: "1 week", responder: "≥4 点"}
  POEM: {recall: "1 week", responder: "≥4 点"}
  SCORAD: {responder: "≥8.7 点（CTG に記載）"}
  HADS: {responder: "<8（基準 ≥8）"}
  PGI-S/PGI-C: {use: "anchor for meaningful change"}
  rule_validated: "PRO は対象集団での妥当性・採点・現物を提出できるもの。探索的は表示に使えない — PREC:Dupi:s138/Q11, Abro:s26/Q17"

background_therapy:
  emollient: "全例に保湿剤（基剤のみ）を 1 日 2 回。添加物入り保湿剤（尿素≥20% 等）は非推奨 — REF:6.1.6.2"
  bleach_bath: "原則不可（評価を歪める）— PREC:Tralo:s42/Q4"
  antihistamines: "非推奨だが継続可 — REF:6.1.6.2"

rescue_table:       # 6.10(c) と 3 節の中間事象は同じ行の並び。check_protocol.py が 1 対 1 を照合
  rows:
    - {therapy: "Topical: TCS any potency, TCI, topical PDE4, other topical immunosuppressants, combination products; phototherapy", ip_action: "continue", estimand_ice: rescue, src: [REF:Table6-3]}
    - {therapy: "Topical JAK inhibitors", ip_action: "permanent discontinuation", estimand_ice: rescue, src: [REF:6.7.3]}
    - {therapy: "Systemic corticosteroids <2 consecutive weeks", ip_action: "continue; interrupt if washout (5 t1/2) not complete before next dose", estimand_ice: rescue, src: [REF:Table6-3, PREC:Dupi:s117/Q4d]}
    - {therapy: "Systemic corticosteroids ≥2 consecutive weeks", ip_action: "permanent discontinuation", estimand_ice: rescue, src: [REF:Table6-3, PREC:Dupi:s117/Q4d]}
    - {therapy: "Conventional systemic immunosuppressants (CsA, AZA, MTX, MMF)", ip_action: "permanent discontinuation", estimand_ice: rescue, src: [REF:Table6-3, PREC:Dupi:s117/Q4d]}
    - {therapy: "Biologics or targeted systemic AD therapy (incl. oral JAK)", ip_action: "permanent discontinuation", estimand_ice: rescue, src: [REF:Table6-3]}
  rules:
    - "rescue 開始時の来院で vIGA-AD・EASI・PP-NRS を記録。薬剤・用量・期間を記録 — PREC:Dupi:s117/Q4d"
    - "flare と rescue の関係を定義 — PREC:Dupi:s117/Q5"
    - "rescue は推奨しない（局所から先に）が、医学的に必要なら許可する、の書き方 — REF:6.1.6.1"

estimands:          # 3 節。5 属性で書く
  intercurrent_events:
    - {ice: "Initiation of rescue therapy for AD", strategy: composite, binary: "以後すべて非反応", continuous: "rescue 前の最悪値（基準値含む）を以後に持ち越す（WOCF）", src: [REF:3, CTG:outcome description, PREC:Lebri:s2/Q4]}
    - {ice: "Permanent discontinuation of IP without rescue", strategy: treatment_policy, handling: "中止後も来院継続し収集した値を使う", src: [REF:3, SAP:2.1]}
  supportive_estimands:
    - "Composite for rescue + discontinuation due to lack of efficacy/AE; treatment policy for other discontinuations — PREC:Lebri:s2/Q4"
    - "Full treatment policy (all ICEs) — SAP Table 9-3"
  population_level_summary: {binary: "difference in proportions (CMH, strata-adjusted)", continuous: "difference in means at the single timepoint (ANCOVA)"}

analysis:
  binary: "CMH test stratified by randomization strata; Mantel-Haenszel risk difference — PREC:Nemo:s19/Q14, Lebri:s21/p28"
  continuous_for_claims: "single timepoint (e.g., Week 16) ANCOVA; MMRM は補助 — PREC:Nemo:s19/Q14, Dupi:s117/Q4e"
  missing_data:
    primary: "Remaining missing after ICE handling → NRI (binary) / MI (continuous) — PREC:Nemo:s19/Q16"
    sensitivity: ["MI with method, number of imputations, seed prespecified", "tipping-point analysis for co-primary — PREC:Nemo:s19/Q16"]
  multiplicity:
    - "co-primary は両方が有意で成功（conjunctive。α の分割不要）"
    - "複数用量: 用量ごとの比較は第 1 種の過誤を制御（graphical / Bonferroni-Holm）— PREC:Tralo:s42/Q6、REF は graphical（Amendment で Appendix 11 を追加）"
    - "維持期（再無作為化）の評価は多重性の計画に入れない — PREC:Tralo:s13/Q16A"
    - "中間解析をするなら時期・盲検維持・α の使い方を事前に — PREC:Tralo:s42/Q6"
  stratification_default: ["baseline disease severity (vIGA-AD 3 vs 4)", "geographic region（日本を含む国際共同なら Japan / non-Japan Asia / RoW — REF）"]
  covariates: "strata + baseline value"
  subgroups: ["age (18–<40, 40–<65, ≥65)", "sex", "race", "region", "weight (<70/≥70 or <75/≥75 kg)", "BMI <25/≥25", "baseline vIGA-AD 3/4", "baseline EASI", "prior systemic therapy", "prior biologic/JAK", "subgroups with <10% pooled"]
  center_size: "1 群 1 施設あたり 8 例程度を目安 — PREC:Dupi:s117/Q4e"

sample_size_priors:   # 10.11。PRIOR は出典必須。値が無い行は TBD のまま計算は感度表で
  rule: "参照試験の結果の数値は MCP では取れない（has_results=true でも値なし）。添付文書 14 節・論文から取り、出典と取得日を書く"
  candidates:
    - source: "USPI DUPIXENT Table 18 (SOLO 1/SOLO 2, Week 16, monotherapy, adults) — 2026-10-03 medlibrary.org で確認"
      solo1: {n: {dupi_q2w: 224, placebo: 224}, iga01: {active: 0.38, placebo: 0.10}, easi75: {active: 0.51, placebo: 0.15}, ppnrs4: {active: 0.41, placebo: 0.12}}
      solo2: {n: {dupi_q2w: 233, placebo: 236}, iga01: {active: 0.36, placebo: 0.09}, easi75: {active: 0.44, placebo: 0.12}, ppnrs4: {active: 0.36, placebo: 0.10}}
    - source: "lebrikizumab ADvocate1/2, tralokinumab ECZTRA1/2, abrocitinib JADE MONO-1/2, nemolizumab ARCADIA — 各 USPI 14 節から取得して追記（未取得）"
  correlation_iga_easi: {value: TBD, note: "co-primary の相関。不明なら独立（保守側）で計算し、0.5〜0.8 の感度表を付ける"}
  dropout: "NRI では脱落は非反応として解析に残る → 例数の割増しではなく反応率の希釈で扱う（scripts/sample_size.py --nri）"

safety_monitoring:
  aesi_candidates_by_mechanism:
    IL-4R/IL-13: ["conjunctivitis/keratitis", "eosinophilia", "injection-site reactions", "herpes infections"]
    JAK: ["serious infections", "MACE", "VTE", "malignancy", "lab abnormalities (lipids, CPK, cytopenias)"]
    OX40/T-cell: ["pyrexia/chills", "infections", "hypersensitivity"]
    IL-31: ["asthma exacerbation", "peripheral edema", "neurodermatitis-like"]
  rule: "AESI は機序から選び、2.2 の既知リスクと 9 節を一致させる。機序が新しいなら IB の [TBD]"
  tb: "IGRA at screening; 再検・予防投与の規則 — REF:8.10.1"
  post_dose_monitoring: "初回投与後の観察時間 [TBD]（REF 8.4.2）"
  mental_health: "抑うつ・自殺念慮の評価（C-SSRS 等）を機序に応じて — REF:8.2.8"
  hepatotoxicity_rules: "付録に中止・再投与規則 — REF:Appendix 7"

soa_rows:   # 1.3 節の行。列（来院）は USER の期間から作る
  - informed_consent
  - eligibility_review
  - demographics_medical_history
  - physical_exam
  - vital_signs
  - ecg
  - hematology_chemistry_urinalysis
  - serology_HIV_HBV_HCV
  - IGRA_tb_questionnaire
  - pregnancy_test
  - randomization
  - ip_administration_and_post_dose_monitoring
  - vIGA-AD
  - EASI
  - SCORAD
  - BSA
  - eDiary_PP-NRS_pain_sleep (daily)
  - DLQI_POEM_HADS_EQ-5D-5L_PGI
  - PK_ADA_samples
  - biomarker_samples
  - concomitant_medications_rescue
  - adverse_events

appendix_tables:
  - "TCS potency category table — REF:Appendix 8 (Table 11-4)"
  - "vIGA-AD full scale text"
  - "Prohibited / rescue therapy tables"
